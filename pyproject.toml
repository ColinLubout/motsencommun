[project]
name = "motsencommun"
version = "0.1.0"
description = "Les expressions françaises, expliquées par ceux qui les apprennent et ceux qui les parlent."
requires-python = "==3.13.*"
dependencies = [
    "django-otp>=1.7.5",
    "django-simple-history>=3.13.0",
    "django[argon2]>=5.2,<5.3",
    "pillow>=13.0.0",
    "pyicu>=2.17",
    "pyyaml>=6.0.3",
    "qrcode>=8.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "motsencommun.settings_tests"
testpaths = ["motsencommun", "lexique"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
# Un avertissement (par exemple une fonction de Django bientôt retirée) fait échouer les tests :
# on le voit tout de suite plutôt qu'au moment de changer de version.
filterwarnings = [
    "error",
    # Le serveur de test de Django (tests du navigateur) laisse ses connexions SQLite
    # au ramasse-miettes, parfois jusqu'à la fin de la session.
    "ignore:unclosed database in <sqlite3.Connection:ResourceWarning",
]
markers = [
    "navigateur: ouvre les pages dans Chromium, par Playwright (uv run playwright install --with-deps chromium)",
]

[tool.ruff]
# Les migrations ne sont jamais modifiées une fois publiées : on ne les reformate pas.
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
# En plus des règles par défaut : tri des imports (I), erreurs probables (B), syntaxe Python
# récente (UP), Django (DJ), sécurité (S) et dates sans fuseau horaire (DTZ).
extend-select = ["I", "B", "UP", "DJ", "S", "DTZ"]
# Django déclare ses réglages en attributs de classe (Meta, admin) : listes et dictionnaires
# y sont l'usage normal, sans annotation ClassVar.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Dans les tests, assert et des mots de passe écrits en clair sont l'outil normal.
"**/tests/*" = ["S101", "S105", "S106"]

[dependency-groups]
audit = [
    "pip-audit>=2.10.1",
]
dev = [
    "axe-playwright-python>=0.1.8",
    "playwright>=1.65.2",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]
